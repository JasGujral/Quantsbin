[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantsbin"
dynamic = ["version"]
description = "Option pricing and derivatives analytics: Black-Scholes, binomial, Monte Carlo, greeks and strategies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jasmeet Gujral" }]
keywords = [
    "option pricing",
    "derivatives",
    "black-scholes",
    "monte carlo",
    "greeks",
    "quantitative finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11.2",
    "pandas>=2.1.1",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/JasGujral/Quantsbin"
Source = "https://github.com/JasGujral/Quantsbin"
Issues = "https://github.com/JasGujral/Quantsbin/issues"
Changelog = "https://github.com/JasGujral/Quantsbin/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "quantsbin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["quantsbin"]

[tool.hatch.build.targets.sdist]
include = [
    "quantsbin/",
    "examples/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff==0.14.0",
    "pyright==1.1.407",
    "pre-commit>=4.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long lines are left to the formatter

[tool.ruff.lint.per-file-ignores]
# These modules import the model classes at the bottom on purpose to break an import cycle.
"quantsbin/derivativepricing/namesnmapper.py" = ["E402"]
"quantsbin/montecarlo/namesnmapper.py" = ["E402"]

[tool.pyright]
include = ["quantsbin"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::RuntimeWarning"]

[tool.coverage.run]
source = ["quantsbin"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
